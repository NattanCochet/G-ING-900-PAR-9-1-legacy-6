# Production-like local run, mirrors what Railway builds/runs from src/Dockerfile.
# Usage: docker compose -f docker-compose.prod.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SQLITE_DB_LOCATION: /data/todo.db
    volumes:
      - todo-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  todo-data:
