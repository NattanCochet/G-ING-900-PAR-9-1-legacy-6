# Production-like local run, mirrors what Railway builds/runs from src/Dockerfile.
# Usage: docker compose -f docker-compose.prod.yml up --build
services:
  app:
    build:
      context: .
      dockerfile: src/Dockerfile
      target: prod
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_TYPE: ${DB_TYPE:-sqlite3}
      SQLITE_DB_LOCATION: /data/todo.db
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DB: ${MYSQL_DB:-todo_db}
    volumes:
      - todo-data:/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-todo_db}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  todo-data:
  mysql-data:
