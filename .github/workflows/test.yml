name: Tests

on:
  workflow_run:
    workflows: ["Lint"]
    types: [completed]

permissions:
  contents: write

jobs:
  test:
    if: github.event.workflow_run.conclusion == 'success' && github.repository == 'EpitechPGE45-2026/G-ING-900-PAR-9-1-legacy-6'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          SQLITE_DB_LOCATION: ${{ runner.temp }}/todo.db

      - name: Deploy test report to GitHub Pages
        if: always() && github.event.workflow_run.event == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: ${{ github.event.workflow_run.head_branch }}
          keep_files: true

      - name: Checkout gh-pages branch
        if: always() && github.event.workflow_run.event == 'push'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Build report index page
        if: always() && github.event.workflow_run.event == 'push'
        run: |
          mkdir -p landing
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test Reports</title></head><body>'
            echo '<h1>Test Reports</h1><ul>'
            find gh-pages-checkout -mindepth 2 -name index.html -not -path '*/jest-html-reporters-attach/*' | sort | while read -r f; do
              rel="${f#gh-pages-checkout/}"
              rel="${rel%/index.html}"
              echo "<li><a href=\"$rel/\">$rel</a></li>"
            done
            echo '</ul></body></html>'
          } > landing/index.html

      - name: Publish report index page
        if: always() && github.event.workflow_run.event == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          keep_files: true
