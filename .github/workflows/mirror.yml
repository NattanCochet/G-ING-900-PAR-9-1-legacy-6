name: Mirror master to personal repo

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mirror-master
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Push master to mirror repo
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          if [ -z "$MIRROR_REPO_TOKEN" ]; then
            echo "::error::MIRROR_REPO_TOKEN secret is not set on this repository."
            exit 1
          fi
          git remote add mirror "https://x-access-token:${MIRROR_REPO_TOKEN}@github.com/NattanCochet/G-ING-900-PAR-9-1-legacy-6.git"
          git push mirror HEAD:master --force