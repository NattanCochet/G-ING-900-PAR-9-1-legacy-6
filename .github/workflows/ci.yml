name: CI

on:
  push:
  pull_request:

env:
  IMAGE_NAME: pilebunker/legacy-app

permissions:
  contents: write

jobs:
  lint:
    if: github.repository == 'EpitechPGE45-2026/G-ING-900-PAR-9-1-legacy-6'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    needs: lint
    if: github.repository == 'EpitechPGE45-2026/G-ING-900-PAR-9-1-legacy-6'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          SQLITE_DB_LOCATION: ${{ runner.temp }}/todo.db

      - name: Deploy test report to GitHub Pages
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: ${{ github.ref_name }}
          keep_files: true

      - name: Checkout gh-pages branch
        if: always() && github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Build report index page
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p landing
          {
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Test Reports</title></head><body>'
            echo '<h1>Test Reports</h1><ul>'
            find gh-pages-checkout -mindepth 2 -name index.html -not -path '*/jest-html-reporters-attach/*' | sort | while read -r f; do
              rel="${f#gh-pages-checkout/}"
              rel="${rel%/index.html}"
              echo "<li><a href=\"$rel/\">$rel</a></li>"
            done
            echo '</ul></body></html>'
          } > landing/index.html

      - name: Publish report index page
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          keep_files: true

  publish:
    needs: test
    if: github.repository == 'EpitechPGE45-2026/G-ING-900-PAR-9-1-legacy-6' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  mirror:
    needs: publish
    if: github.repository == 'EpitechPGE45-2026/G-ING-900-PAR-9-1-legacy-6' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    concurrency:
      group: mirror-master
      cancel-in-progress: true

    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MIRROR_REPO_TOKEN }}
          ref: master
          fetch-depth: 0

      - name: Push master to mirror repo
        env:
          MIRROR_REPO_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
        run: |
          if [ -z "$MIRROR_REPO_TOKEN" ]; then
            echo "::error::MIRROR_REPO_TOKEN secret is not set on this repository."
            exit 1
          fi

          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Mirror"

          TARGET_URL="https://x-access-token:${MIRROR_REPO_TOKEN}@github.com/NattanCochet/G-ING-900-PAR-9-1-legacy-6.git"

          git remote remove mirror 2>/dev/null || true
          git remote add mirror "$TARGET_URL"

          git push mirror HEAD:master --force
          git push mirror --tags --force
